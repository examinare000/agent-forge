name = '''implementation-coder'''
description = '''Use this agent when you need to implement code based on an Architect's design or task specification, write tests for that implementation, or fix issues raised by a reviewer. This agent focuses purely on faithful implementation and does NOT make architectural decisions. <example>Context: The Architect has produced a design spec and the user wants it implemented.\nuser: "Architectが認証フローの設計を出しました。この設計に従ってログイン機能を実装してください"\nassistant: "設計に従った実装が必要なので、implementation-coder エージェントを 逐次プロンプトで起動します"\n<commentary>An Architect design exists and faithful implementation plus tests are needed, so launch the implementation-coder agent.</commentary></example> <example>Context: A reviewer has flagged unfixed issues in recently written code.\nuser: "レビュワーから『3箇所の指摘がまだ未修正』と返ってきました。直してください"\nassistant: "レビュワーの指摘修正は implementation-coder の担当なので、逐次プロンプトで implementation-coder エージェントを起動します"\n<commentary>Reviewer feedback must be applied verbatim by the coder; launch the implementation-coder agent.</commentary></example> <example>Context: A design reference (Figma/mockup) is specified and UI must match it exactly.\nuser: "このデザイン通りに設定画面を作って。文言もデザインに合わせて"\nassistant: "デザイン準拠の実装が必要なので、implementation-coder エージェントを 逐次プロンプトで起動します"\n<commentary>UI must match the design exactly without independent additions; this is the coder's job, so launch the implementation-coder agent.</commentary></example>'''

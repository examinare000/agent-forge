name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: show bash version (matrix leg premise)
        run: bash --version | head -1

      # 各 .test.sh / selftest.sh は git user 設定を内部で都度 `git -C <tmp> config`
      # しており、uv 等の外部ランタイムにも依存しない（generators/build.py は
      # Python3標準ライブラリのみ）ため、追加セットアップ不要で実行できる。
      - name: installer smoke test
        run: bash installer/install.test.sh

      - name: generators selftest
        run: bash generators/selftest.sh

      - name: agent-blocks drift check
        run: bash generators/check-agent-blocks.sh

      - name: check-agent-blocks selftest
        run: bash generators/check-agent-blocks.test.sh

      - name: scaffold new-project smoke test
        run: bash scaffold/new-project.test.sh

      - name: scaffold check-agent-assets smoke test
        run: bash scaffold/templates/scripts/check-agent-assets.test.sh

      - name: forge dispatcher smoke test
        run: bash bin/forge.test.sh

      - name: block-debug-log-residue hook test
        run: bash hooks/block-debug-log-residue.test.sh

      - name: lint-after-edit hook test
        run: bash hooks/lint-after-edit.test.sh

      - name: backup-before-compact hook test
        run: bash hooks/backup-before-compact.test.sh

      - name: approve-safe-rm hook test
        run: bash hooks/approve-safe-rm.test.sh

      - name: json.sh lib smoke test
        run: bash hooks/lib/json.test.sh

      - name: settings-parity test
        run: bash hooks/settings-parity.test.sh

      - name: check-docs smoke test
        run: bash scaffold/templates/scripts/check-docs.test.sh

      - name: evals harness selftest
        run: bash evals/harness-selftest.sh

      # dist/ は generators/build.py の生成物。rules/ や skills/ を編集して
      # dist/ の再生成を忘れるドリフトを検知する（生成物改ざん検知）。
      - name: verify dist/ is up to date
        run: |
          python3 generators/build.py
          git diff --exit-code dist/
          # git diff は未追跡ファイルを検出しないため、生成物の追加漏れは status で拾う
          test -z "$(git status --porcelain dist/)"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        run: |
          shellcheck --version
          git ls-files '*.sh' | xargs shellcheck -x -S warning
          shellcheck -x -S warning bin/forge
      - name: python bytecode check
        run: python3 -m py_compile generators/build.py
      - name: validate JSON configs
        run: jq empty claude/settings.base.json installer/manifest.json dist/codex-plugin/plugin.json

  # matrix の fan-in ゲート。ブランチ保護 ruleset の必須チェック名 `test` は
  # matrix 化で `test (os)` に分裂して直接は満たせないため、全レーンを待ち受ける
  # 単一ジョブとして `test` を残す（matrix + 必須チェックの標準パターン）。
  test:
    needs: test-matrix
    runs-on: ubuntu-latest
    steps:
      - run: echo "all matrix legs passed"

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
